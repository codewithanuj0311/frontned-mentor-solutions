<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | QR code component</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>
  <main class="card">
    <section class="card-body">
      <img src="./images/image-qr-code.png" alt="QR code image" class="card-img">
      <section class="card-text">
        <h2 class="card-heading">Improve your front-end skills by building projects</h2>
        <p class="card-desc">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
      </section>

    </section>
  </main>
</body>

</html>
