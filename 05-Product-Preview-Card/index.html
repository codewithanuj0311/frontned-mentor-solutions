<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
    rel="stylesheet">
  <title>Frontend Mentor | Product preview card component</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="prod-card">
    <section class="left">
      <picture>
        <source
          media="(max-width: 640px)"
          srcset="./images/image-product-mobile.jpg"
          class="prod-img-mobile"
        />
      
        <img
          src="./images/image-product-desktop.jpg"
          alt="A perfume glass bottle between green leaves"
          class="prod-img-desktop"
        />
      </picture>
    </section>
    <section class="right">
      <p class="prod-category">Perfume</p>
      <h1 class="prod-title">Gabrielle Essence Eau De Parfum</h1>
      <p class="prod-description">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.</p>
        <p class="prod-price"><span class="prod-disc-price">$149.99</span><span class="prod-old-price">$169.99</span></p>
        <button class="btn">
          <img src="./images/icon-cart.svg" alt="Cart image" class="cart-img">
          Add to Cart
        </button>
    </section>
  </main>

</body>

</html>
