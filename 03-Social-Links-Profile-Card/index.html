<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Social links profile</title>

</head>

<body>
  <main class="card">
    <header>
      <img src="./assets/images/avatar-jessica.jpeg" alt="A Girl Profile Photo" class="card-img">
      <section class="heading">
        <h1 class="title">Jessica Randall</h1>
        <p class="address">London, United Kingdom</p>
      </section>
    </header>
    <section>
      <p class="role">"Front-end developer and avid reader."</p>
    </section>
    <section class="profiles">
      <a href="https://github.com/" class="github">GitHub</a>
      <a href="https://www.frontendmentor.io/" class="frontend-mentor">Frontend Mentor</a>
      <a href="https://in.linkedin.com/" class="linkedin">LinkedIn</a>
      <a href="https://x.com/" class="twitter">Twitter</a>
      <a href="https://www.instagram.com/?hl=en" class="instagram">Instagram</a>
    </section>
  </main>

</body>

</html>
